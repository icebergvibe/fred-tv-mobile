plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "dev.fredol.open_tv"
    compileSdk = 36
    ndkVersion = "29.0.14206865"
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
    
    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "dev.fredol.open_tv"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ["**/libc++_shared.so"]
        }
    }

    buildTypes {
        debug {
            // Installs next to the Play Store build (different signing key).
            applicationIdSuffix = ".dev"
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    def media3_version = "1.4.1"
    // Native ExoPlayer path (Android only; other platforms use media_kit).
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    // Google Cast sender (Chromecast). Uses the Cast SDK directly rather than
    // media3-cast, which pulls in Jetpack Compose and hides live-stream flags.
    implementation "com.google.android.gms:play-services-cast-framework:22.3.1"
    implementation "androidx.mediarouter:mediarouter:1.8.1"
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    // Cast pipeline: FFmpeg 8.1 (GPL build: x264 + MediaCodec + TLS) turns any
    // IPTV stream into H.264/AAC HLS, served to the receiver by NanoHTTPD.
    // Maintained fork of the retired ffmpeg-kit (com.arthenica), 16 KB aligned.
    implementation "com.antonkarpenko:ffmpeg-kit-https-gpl:2.2.1"
    implementation "org.nanohttpd:nanohttpd:2.3.1"
}
